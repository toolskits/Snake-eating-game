<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            touch-action: none; /* Prevents screen scrolling while playing */
        }
        #game-container {
            position: relative;
            border: 2px solid #4caf50;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background-color: #222;
        }
        #start-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .stats { margin: 10px 0; font-size: 1.2rem; }
        .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; }
        .btn { width: 60px; height: 60px; background: #333; border: 1px solid #555; color: white; border-radius: 10px; font-size: 20px; }
        #leaderboard { margin-top: 20px; text-align: center; }
        ol { padding: 0; list-style-position: inside; }
    </style>
</head>
<body>

    <h1>Advanced Snake Game 🚀</h1>

    <div class="stats">
        Score: <span id="score">0</span> | Level: <span id="level">1</span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="start-menu">
            <h2 id="menu-title">Ready?</h2>
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <div class="controls">
        <div></div><button class="btn" id="up">↑</button><div></div>
        <button class="btn" id="left">←</button><button class="btn" id="down">↓</button><button class="btn" id="right">→</button>
    </div>

    <div id="leaderboard">
        <h3>Leaderboard 🏆</h3>
        <ol id="leaders"></ol>
    </div>

    <script src="script.js"></script>
</body>
</html>
